# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - skip: true

changelog:
  sort: asc
  use: github
  format: "{{ .Message }}"
  groups:
    - title: Breaking Changes
      regexp: '^.*?[a-z]+(\([[:word:]/-]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([[:word:]/-]+\))??!?:.+$'
      order: 1
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]/-]+\))??!?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\([[:word:]/-]+\))??!?:.+$'
      order: 3
    - title: Refactoring
      regexp: '^.*?refactor(\([[:word:]/-]+\))??!?:.+$'
      order: 4
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]/-]+\))??!?:.+$'
      order: 5
    - title: Other
      order: 999
  filters:
    exclude:
      - '^(ci|chore|test)(\([^)]*\))?!?:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: altessa-s
    name: go-convert
  prerelease: auto
  name_template: "{{.Tag}}"
